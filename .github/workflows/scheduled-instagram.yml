name: Scheduled Instagram Reels

on:
  schedule:
    # 08:00, 08:30, ..., 20:00 IST (02:30-14:30 UTC).
    - cron: "30 2-14 * * *"
    - cron: "0 3-14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AI_PROVIDER: groq
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_IDS: ${{ secrets.CLOUDFLARE_ACCOUNT_IDS }}
      CLOUDFLARE_API_TOKENS: ${{ secrets.CLOUDFLARE_API_TOKENS }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_GRAPH_API_VERSION: ${{ vars.INSTAGRAM_GRAPH_API_VERSION || 'v27.0' }}
      BRAND_NAME: ${{ vars.BRAND_NAME || 'The Daily Chronicle' }}
      OUTPUT_DIR: output

    steps:
      - name: Check out default branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Research news and publish only eligible Reels
        run: python -m app.main --publish-instagram

      - name: Save Groq response for failed runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: groq-response-debug
          path: output/**/groq_response.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Persist posting and duplicate-detection history
        if: always()
        run: |
          if git diff --quiet -- shortlisted_headlines.json posting_history.json credential_rotation.json; then
            echo "No posting history updates to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shortlisted_headlines.json posting_history.json credential_rotation.json
          git commit -m "Update scheduled posting history"
          git push
